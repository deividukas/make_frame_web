<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <title>Make-Frame | Branded Social Media Photo Frames for Events</title>
    <meta name="description" content="The easiest way for event organizers to turn attendee selfies into branded, shareable social posts. Boost engagement for conferences, exhibitions, concerts, and movements." />
    
    <link rel="canonical" href="https://make-frame.com/" />
    
    <meta property="og:title" content="Make-Frame | Branded Social Media Photo Frames for Events" />
    <meta property="og:description" content="The easiest way for event organizers to turn attendee selfies into branded, shareable social posts. Boost engagement for conferences, exhibitions, concerts, and movements." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://make-frame.com/" />
    <meta property="og:image" content="https://make-frame.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Make-Frame" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@makeframe" />
    <meta name="twitter:title" content="Make-Frame | Branded Social Media Photo Frames for Events" />
    <meta name="twitter:description" content="The easiest way for event organizers to turn attendee selfies into branded, shareable social posts." />
    <meta name="twitter:image" content="https://make-frame.com/opengraph.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="fetch" href="/api/content" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://grainy-gradients.vercel.app" crossorigin>
    
    <!-- Non-blocking font loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- Critical CSS - enables instant render without waiting for full CSS -->
    <style>
      :root {
        --primary-color: #7c3aed;
        --background-color: #ffffff;
        --text-color: #0f172a;
        --text-secondary: #64748b;
        --border-color: #e2e8f0;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-heading: 'Geist', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; -webkit-font-smoothing: antialiased; }
      body { 
        font-family: var(--font-sans); 
        background: var(--background-color); 
        color: var(--text-color);
        line-height: 1.5;
      }
      
      /* Critical navbar styles */
      .critical-nav {
        position: sticky;
        top: 0;
        z-index: 50;
        width: 100%;
        height: 64px;
        border-bottom: 1px solid rgba(226, 232, 240, 0.4);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        max-width: 100%;
      }
      .critical-nav-inner {
        max-width: 80rem;
        margin: 0 auto;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .critical-logo {
        height: 40px;
        width: auto;
      }
      
      /* Critical hero styles */
      .critical-hero {
        padding: 5rem 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .critical-hero-inner {
        max-width: 80rem;
        margin: 0 auto;
        display: grid;
        gap: 3rem;
        align-items: center;
      }
      @media (min-width: 1024px) {
        .critical-hero-inner { grid-template-columns: 1fr 1fr; gap: 2rem; }
        .critical-hero { padding: 7rem 1.5rem; }
      }
      .critical-hero h1 {
        font-family: var(--font-heading);
        font-size: clamp(2rem, 5vw, 4.5rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--text-color);
      }
      .critical-hero p {
        font-size: 1.125rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin-top: 1rem;
        font-weight: 300;
        line-height: 1.7;
      }
      .critical-hero-buttons {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 2rem;
      }
      .critical-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 2rem;
        border-radius: 0.5rem;
        font-weight: 700;
        font-size: 1.125rem;
        text-decoration: none;
        transition: all 0.2s;
      }
      .critical-btn-primary {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.25);
      }
      .critical-btn-outline {
        background: transparent;
        color: var(--text-color);
        border: 1px solid var(--border-color);
      }
      .critical-hero-image {
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(226, 232, 240, 0.5);
        background: linear-gradient(to bottom, white, #f8fafc);
        height: 400px;
      }
      @media (min-width: 768px) { .critical-hero-image { height: 480px; } }
      .critical-hero-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      
      /* Loading skeleton */
      .skeleton {
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      /* Animation classes */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in-scale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
      .animate-fade-in-scale { animation: fade-in-scale 0.7s ease-out forwards; opacity: 0; }
      
      /* Hide static content when React mounts */
      #static-content { display: block; }
      #root:not(:empty) + #static-content { display: none; }
      #root:empty { display: none; }
      #root:not(:empty) { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Static fallback content - shows instantly, hidden when React loads -->
    <div id="static-content">
      <nav class="critical-nav">
        <div class="critical-nav-inner">
          <svg viewBox="0 0 320 50" fill="none" xmlns="http://www.w3.org/2000/svg" class="critical-logo">
            <g transform="translate(8, 8) rotate(-12, 17, 17)">
              <rect x="0" y="8" width="34" height="6" rx="3" fill="#7c3aed" />
              <rect x="0" y="20" width="34" height="6" rx="3" fill="#7c3aed" />
              <rect x="8" y="0" width="6" height="34" rx="3" fill="#7c3aed" />
              <rect x="20" y="0" width="6" height="34" rx="3" fill="#7c3aed" />
            </g>
            <text x="58" y="33" fill="#7c3aed" style="font: 700 24px Inter, sans-serif">Make-frame.com</text>
          </svg>
          <div style="display: flex; gap: 1rem; align-items: center;">
            <span style="color: #64748b; font-size: 0.875rem;">Loading...</span>
          </div>
        </div>
      </nav>
      <section class="critical-hero">
        <div class="critical-hero-inner">
          <div class="animate-fade-in-up">
            <h1>Your Attendees Are Your Best Ad Agency</h1>
            <p>The easiest photo frame generator built for event organizers. Transform attendee selfies into professional, branded posts that grow your organic reach.</p>
            <div class="critical-hero-buttons">
              <a href="https://staging.make-frame.com/signup" class="critical-btn critical-btn-primary">Get Started Free</a>
              <a href="#demo" class="critical-btn critical-btn-outline">View Demo</a>
            </div>
          </div>
          <div class="critical-hero-image animate-fade-in-scale" style="animation-delay: 0.2s;">
            <div class="skeleton" style="width: 100%; height: 100%;"></div>
          </div>
        </div>
      </section>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
