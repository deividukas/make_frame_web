<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta property="og:title" content="Make-frame - Your Attendees Are Your Best Ad Agency" />
    <meta property="og:description" content="The easiest photo frame generator built for event organizers. Transform attendee selfies into professional, branded posts." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://replit.com/public/images/opengraph.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@replit" />
    <meta name="twitter:title" content="Make-frame - Your Attendees Are Your Best Ad Agency" />
    <meta name="twitter:description" content="The easiest photo frame generator built for event organizers. Transform attendee selfies into professional, branded posts." />
    <meta name="twitter:image" content="https://replit.com/public/images/opengraph.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Critical CSS for hero/above-fold */
      *,::after,::before{box-sizing:border-box;border:0 solid}
      html{font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
      body{margin:0;line-height:inherit;background-color:hsl(240 5% 98%);color:hsl(240 10% 4%)}
      h1,h2,h3{margin:0;font-weight:700;font-family:Geist,sans-serif}
      img,video{max-width:100%;height:auto;display:block}
      a{color:inherit;text-decoration:inherit}
      button{font-family:inherit;font-size:100%;line-height:inherit;color:inherit;margin:0;padding:0;background:transparent;cursor:pointer}
      #root{min-height:100vh}
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem}
      @media(min-width:1024px){.container{max-width:80rem}}
      .flex{display:flex}.items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}
      .sticky{position:sticky}.top-0{top:0}.z-50{z-index:50}
      .gap-2{gap:.5rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}
      .py-20{padding-top:5rem;padding-bottom:5rem}.py-24{padding-top:6rem;padding-bottom:6rem}
      .px-4{padding-left:1rem;padding-right:1rem}.px-6{padding-left:1.5rem;padding-right:1.5rem}
      .h-16{height:4rem}
      .max-w-7xl{max-width:80rem}.mx-auto{margin-left:auto;margin-right:auto}
      .text-center{text-align:center}
      .text-4xl{font-size:2.25rem;line-height:2.5rem}.text-5xl{font-size:3rem;line-height:1}.text-lg{font-size:1.125rem;line-height:1.75rem}
      .font-bold{font-weight:700}.font-semibold{font-weight:600}
      .text-primary{color:#7c3aed}
      .text-muted-foreground{color:hsl(240 4% 46%)}
      .bg-background{background-color:hsl(240 5% 98%)}
      .border-b{border-bottom-width:1px}
      .border-border\/40{border-color:rgba(229,229,229,.4)}
      .backdrop-blur{backdrop-filter:blur(8px)}
      .rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
      .shadow-lg{box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05)}
      .grid{display:grid}
      @media(min-width:1024px){.lg\\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.lg\\:gap-16{gap:4rem}}
      @media(min-width:768px){.md\\:px-6{padding-left:1.5rem;padding-right:1.5rem}.md\\:flex{display:flex}}
      .hidden{display:none}
      .space-y-4>:not([hidden])~:not([hidden]){margin-top:1rem}
      .space-y-6>:not([hidden])~:not([hidden]){margin-top:1.5rem}
    </style>
  </head>
  <body>
    <script>window.__INITIAL_DATA__ = null;</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
